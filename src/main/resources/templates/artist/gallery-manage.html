<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tác phẩm - Artist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="#">
                <i class="fa-solid fa-wand-magic-sparkles me-2"></i>Artist Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#artistNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="artistNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/artist/schedule}">
                            <i class="fa-regular fa-calendar-check me-1"></i> Lịch làm việc
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/artist/gallery-manage}">
                            <i class="fa-regular fa-id-card me-1"></i> Tác phẩm của tôi
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center text-white">
                    <span class="me-3">
                        <i class="fa-regular fa-user me-1"></i>
                        <span th:text="${artist != null ? artist.fullName : 'Artist'}">Artist</span>
                    </span>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTAINER NỘI DUNG -->
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">
                <i class="fa-solid fa-images text-primary me-2"></i>Bộ sưu tập tác phẩm
            </h3>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="fa-solid fa-plus me-1"></i> Thêm tác phẩm mới
            </button>
        </div>

        <!-- DANH SÁCH TÁC PHẨM -->
        <div class="row g-4">
            <div class="col-md-4 col-sm-6" th:each="work : ${myWorks}">
                <div class="card h-100 shadow-sm border-0">
                    <img th:src="@{'/uploads/' + ${work.imageUrl}}" 
                        class="card-img-top bg-light" 
                        alt="Work image" 
                        style="height: 250px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${work.title}">Tiêu đề tác phẩm</h5>
                        <p class="card-text text-muted small" th:text="${work.description}">Mô tả tác phẩm...</p>
                    </div>
                    <div class="card-footer bg-white border-0 pt-0 text-end">
                        <a th:href="@{/artist/gallery-manage/delete/{id}(id=${work.id})}" 
                           class="btn btn-outline-danger btn-sm" 
                           onclick="return confirm('Bạn có chắc chắn muốn xóa tác phẩm này?');">
                            <i class="fa-solid fa-trash me-1"></i> Xóa
                        </a>
                    </div>
                </div>
            </div>

            <!-- Trường hợp chưa có tác phẩm -->
            <div class="col-12" th:if="${#lists.isEmpty(myWorks)}">
                <div class="alert alert-secondary text-center py-4 mb-0">
                    Chưa có tác phẩm nào được tải lên. Hãy bấm nút <strong>Thêm tác phẩm mới</strong> ở trên!
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL UPLOAD TÁC PHẨM -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/artist/gallery-manage/upload}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Thêm tác phẩm mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên/Tiêu đề tác phẩm</label>
                            <input type="text" name="title" class="form-control" placeholder="Ví dụ: Trang điểm cô dâu tone Tây" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả chi tiết</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Mô tả về tone trang điểm, phong cách..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn ảnh tác phẩm</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Tải lên</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
