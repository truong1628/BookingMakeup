<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Makeup Artist - DUNG DORYS ADMIN</title>
    
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>
<div th:replace="~{fragments/admin-navbar :: adminNavbar('artists')}"></div>

<!-- NỘI DUNG CHÍNH (MAIN CONTENT) -->
<div class="container-fluid px-4 main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Quản lý Makeup Artist</h3>
            <span class="text-muted fs-7">Danh sách đội ngũ Chuyên viên trang điểm</span>
        </div>
        <div>
            <a th:href="@{/admin/artists/add}" class="btn btn-success shadow-sm">
                <i class="fas fa-user-plus me-1"></i> Thêm Makeup Artist
            </a>
        </div>
    </div>

    <!-- Bảng danh sách Artist -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3" style="width: 70px;">ID</th>
                            <th class="text-center">Ảnh</th>
                            <th>Họ tên</th>
                            <th>Số điện thoại</th>
                            <th>Kinh nghiệm</th>
                            <th>Mô tả</th>
                            <th class="text-end pe-3" style="width: 150px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(artists)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                Chưa có Chuyên viên trang điểm nào trong danh sách.
                            </td>
                        </tr>

                        <tr th:each="artist : ${artists}">
                            <td class="ps-3 fw-semibold" th:text="${artist.id}"></td>
                            <td class="text-center">
                                <img th:src="@{'/uploads/' + ${artist.image}}"
                                     alt="Artist Avatar"
                                     width="60"
                                     height="60"
                                     class="rounded-circle shadow-sm"
                                     style="object-fit:cover">
                            </td>
                            <td class="fw-bold text-dark" th:text="${artist.fullName}"></td>
                            <td th:text="${artist.phone}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${artist.experience}"></span>
                            </td>
                            <td class="text-muted" th:text="${artist.description}"></td>
                            <td class="text-end pe-3">
                                <div class="btn-group">
                                    <a th:href="@{/admin/artists/{id}/edit(id=${artist.id})}"
                                       class="btn btn-warning btn-sm me-1">
                                        <i class="fas fa-edit me-1"></i>Sửa
                                    </a>

                                    <form th:action="@{/admin/artists/{id}(id=${artist.id})}"
                                          method="post"
                                          style="display:inline;">
                                        <input type="hidden" name="_method" value="delete">
                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Bạn có chắc muốn xóa Artist này?')">
                                            <i class="fas fa-trash-alt me-1"></i>Xóa
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
