<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Quản lý đánh giá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Quản lý đánh giá
    </h2>

    <a href="/admin"
       class="btn btn-secondary mb-3">
        ← Quay lại
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Khách hàng</th>

            <th>Dịch vụ</th>

            <th>Số sao</th>

            <th>Bình luận</th>

            <th>Ngày đánh giá</th>

            <th>Thao tác</th>

        </tr>

        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(reviews)}">

            <td colspan="7"
                class="text-center text-muted">

                Chưa có đánh giá nào.

            </td>

        </tr>

        <tr th:each="review : ${reviews}">

            <td th:text="${review.id}"></td>

            <td th:text="${review.user.fullName}"></td>

            <td th:text="${review.service.serviceName}"></td>

            <td class="text-warning">

                <span th:each="i : ${#numbers.sequence(1,5)}">

                    <span th:if="${i <= review.rating}">
                        ★
                    </span>

                    <span th:if="${i > review.rating}">
                        ☆
                    </span>

                </span>

            </td>

            <td th:text="${review.comment}"></td>

            <td th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')}"></td>

            <td>

                <form th:action="@{/admin/reviews/{id}(id=${review.id})}"
                      method="post">

                    <input type="hidden"
                           name="_method"
                           value="delete">

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Bạn chắc chắn muốn xóa đánh giá này?')">

                        Xóa

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
