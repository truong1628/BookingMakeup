<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- NAVBAR ADMIN FRAGMENT -->
    <nav th:fragment="adminNavbar(activeMenu)" class="navbar navbar-expand-lg navbar-dark admin-navbar sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-4" th:href="@{/admin}">
                DUNG DORYS ADMIN
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarContent" 
                    aria-controls="adminNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="adminNavbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                    <!-- 1. Trang chủ & Thống kê -->
                    <li class="nav-item">
                        <a th:href="@{/admin}" 
                           class="nav-link" 
                           th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                            <i class="fas fa-chart-line"></i>
                            <span>Trang chủ & Thống kê</span>
                        </a>
                    </li>

                    <!-- 2. Quản lý Đặt lịch -->
                    <li class="nav-item">
                        <a th:href="@{/admin/bookings}" 
                           class="nav-link" 
                           th:classappend="${activeMenu == 'bookings' ? 'active' : ''}">
                            <i class="fas fa-calendar-check"></i>
                            <span>Quản lý Đặt lịch</span>
                        </a>
                    </li>

                    <!-- 3. Quản lý Dịch vụ -->
                    <li class="nav-item">
                        <a th:href="@{/admin/services}" 
                           class="nav-link" 
                           th:classappend="${activeMenu == 'services' ? 'active' : ''}">
                            <i class="fas fa-concierge-bell"></i>
                            <span>Quản lý Dịch vụ</span>
                        </a>
                    </li>

                    <!-- 4. Quản lý Artist -->
                    <li class="nav-item">
                        <a th:href="@{/admin/artists}" 
                           class="nav-link" 
                           th:classappend="${activeMenu == 'artists' ? 'active' : ''}">
                            <i class="fas fa-user-tie"></i>
                            <span>Quản lý Artist</span>
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="fas fa-sign-out-alt me-1"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
