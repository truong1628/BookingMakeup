<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- NAVBAR USER / CLIENT FRAGMENT -->
    <nav th:fragment="userNavbar(activeMenu)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" th:href="@{/}">
                <i class="fa-solid fa-wand-magic-sparkles text-danger me-2"></i>
                <span style="letter-spacing: 1px;">DUNG DORYS</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <!-- 1. Trang chủ -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeMenu == 'home' ? 'active' : ''}" th:href="@{/}">
                            <i class="fa-solid fa-house me-1"></i> Trang chủ
                        </a>
                    </li>

                    <!-- 2. Dịch vụ -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeMenu == 'services' ? 'active' : ''}" th:href="@{/#services}">
                            <i class="fa-solid fa-spray-can-sparkles me-1"></i> Dịch vụ
                        </a>
                    </li>

                    <!-- 3. Bộ Sưu Tập -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeMenu == 'gallery' ? 'active' : ''}" th:href="@{/gallery}">
                            <i class="fa-solid fa-images me-1"></i> Bộ Sưu Tập
                        </a>
                    </li>

                    <!-- 4. Về chúng tôi -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeMenu == 'why-us' ? 'active' : ''}" th:href="@{/#why-us}">
                            <i class="fa-solid fa-circle-info me-1"></i> Về chúng tôi
                        </a>
                    </li>

                    <!-- 5. Liên hệ -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeMenu == 'contact' ? 'active' : ''}" th:href="@{/#contact}">
                            <i class="fa-solid fa-envelope me-1"></i> Liên hệ
                        </a>
                    </li>
                </ul>

                <!-- Chưa đăng nhập -->
                <div th:if="${loginUser == null}" class="d-flex gap-2 mt-3 mt-lg-0">
                    <a th:href="@{/login}" class="btn btn-outline-light px-4 rounded-pill">
                        <i class="fa-regular fa-user me-1"></i> Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-danger px-4 rounded-pill">
                        <i class="fa-solid fa-user-plus me-1"></i> Đăng ký
                    </a>
                </div>

                <!-- Đã đăng nhập -->
                <div th:if="${loginUser != null}" class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <div class="text-white">
                        <small class="d-block text-white-50" style="font-size: 0.75rem;">Xin chào,</small>
                        <span class="fw-bold" th:text="${loginUser.fullName}">Khách hàng</span>
                    </div>

                    <a th:if="${loginUser.role == 'USER'}" th:href="@{/booking/my}" class="btn btn-sm btn-outline-light rounded-pill px-3">
                        <i class="fa-regular fa-calendar-check me-1"></i> Lịch của tôi
                    </a>

                    <a th:href="@{/logout}" class="btn btn-sm btn-danger rounded-circle p-2" onclick="return confirm('Bạn có chắc chắn muốn đăng xuất không?');" title="Đăng xuất" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-power-off"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
