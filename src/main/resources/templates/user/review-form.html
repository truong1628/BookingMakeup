<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đánh giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Đánh giá dịch vụ</h2>
    <h4 th:text="${booking.service.serviceName}"></h4>

    <form th:action="@{/review}"
          th:object="${review}"
          method="post">

        <!-- 🟢 1. Thêm CSRF token để tránh bị Spring Security chặn request POST -->
        <input type="hidden"
               th:if="${_csrf}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <!-- 🟢 2. Truyền bookingId -->
        <input type="hidden"
               name="bookingId"
               th:value="${booking.id}">

        <div class="mb-3">
            <label class="form-label">Số sao</label>
            <select class="form-select" th:field="*{rating}">
                <option value="1">⭐ 1</option>
                <option value="2">⭐⭐ 2</option>
                <option value="3">⭐⭐⭐ 3</option>
                <option value="4">⭐⭐⭐⭐ 4</option>
                <option value="5" selected>⭐⭐⭐⭐⭐ 5</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Bình luận</label>
            <textarea class="form-control"
                      rows="5"
                      th:field="*{comment}"
                      placeholder="Nhập cảm nhận của bạn về dịch vụ..."></textarea>
            <!-- Hiển thị lỗi nếu validate không đạt -->
            <div class="text-danger" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
        </div>

        <!-- 🟢 3. Thêm type="submit" cho button -->
        <button type="submit" class="btn btn-success">
            Gửi đánh giá
        </button>

    </form>

</div>

</body>
</html>
