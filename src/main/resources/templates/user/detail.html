<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết dịch vụ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img th:src="@{'/uploads/' + ${service.image}}"
             class="img-fluid rounded">

        </div>

        <div class="col-md-6">

            <h2 th:text="${service.serviceName}"></h2>
            
            <h4 class="text-danger mt-3">
                <span th:text="${service.price}"></span> VNĐ
            </h4>

            <p class="mt-3">
                <strong>Thời gian:</strong>
                <span th:text="${service.duration}"></span> phút
            </p>

            <p th:text="${service.description}"></p>

            <a th:href="@{/booking/create/{id}(id=${service.id})}"
                class="btn btn-danger btn-lg">
                Đặt lịch ngay
            </a>

        </div>

    </div>

</div>
<hr class="my-5">

<h3>Đánh giá của khách hàng</h3>
<div class="mb-3">

    <span class="text-warning fs-4">

        <span th:each="i : ${#numbers.sequence(1,5)}">

            <span th:if="${i <= avgRating}">⭐</span>

            <span th:if="${i > avgRating}">☆</span>

        </span>

    </span>

    <strong
        th:text="${#numbers.formatDecimal(avgRating,1,1)}">
    </strong>

    /5

    (<span th:text="${#lists.size(reviews)}"></span>
    đánh giá)

</div>
<div th:if="${#lists.isEmpty(reviews)}"
     class="alert alert-secondary">

    Chưa có đánh giá nào.

</div>

<div th:each="review : ${reviews}"
     class="card mb-3">

    <div class="card-body">

        <h5 class="card-title"
            th:text="${review.user.fullName}">
        </h5>

        <p class="text-warning fs-5">

    <span th:each="i : ${#numbers.sequence(1,5)}">

        <span th:if="${i <= review.rating}">
            ⭐
        </span>

        <span th:if="${i > review.rating}">
            ☆
        </span>

    </span>

</p>

        <p class="card-text"
           th:text="${review.comment}">
        </p>

        <small class="text-muted"
               th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')}">
        </small>

    </div>

</div>
</body>
</html>
